name: Build & deploy RSS feed

on:
  schedule:
    # Täglich 07:15 UTC
    - cron: "15 7 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# Nötig für GitHub Pages Deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed generieren
        run: python3 generate_feed.py public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
